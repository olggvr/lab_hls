server:
  port: ${ACADEMIC_PORT:8081}
  error:
    include-message: always

spring:
  datasource:
    url: ${ACADEMIC_DB_URL:jdbc:postgresql://localhost:5432/academic}
    username: ${ACADEMIC_DB_USER:school}
    password: ${ACADEMIC_DB_PASSWORD:school}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    contexts: ${ACADEMIC_LIQUIBASE_CONTEXTS:demo}
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    operations-sorter: method
    tags-sorter: alpha
