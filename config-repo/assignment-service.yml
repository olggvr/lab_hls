server:
  port: ${ASSIGNMENT_PORT:8083}
  error:
    include-message: always

spring:
  r2dbc:
    url: ${ASSIGNMENT_DB_URL:r2dbc:postgresql://localhost:5434/assignments}
    username: ${ASSIGNMENT_DB_USER:school}
    password: ${ASSIGNMENT_DB_PASSWORD:school}
  sql:
    init:
      mode: always
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

springdoc:
  api-docs:
    path: /v3/api-docs
