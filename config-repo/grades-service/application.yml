server:
  port: ${GRADES_PORT:8084}
  error:
    include-message: always

spring:
  datasource:
    url: ${GRADES_DB_URL:jdbc:postgresql://localhost:5435/grades}
    username: ${GRADES_DB_USER:school}
    password: ${GRADES_DB_PASSWORD:school}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      jakarta.persistence.validation.mode: callback
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

springdoc:
  api-docs:
    path: /v3/api-docs
