server:
  port: ${MESSAGE_PORT:8082}
  error:
    include-message: always

spring:
  r2dbc:
    url: ${MESSAGE_DB_URL:r2dbc:postgresql://localhost:5433/messages}
    username: ${MESSAGE_DB_USER:school}
    password: ${MESSAGE_DB_PASSWORD:school}
  sql:
    init:
      mode: always
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

springdoc:
  api-docs:
    path: /v3/api-docs
