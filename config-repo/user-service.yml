server:
  port: ${USER_PORT:8081}
  error:
    include-message: always

spring:
  datasource:
    url: ${USER_DB_URL:jdbc:postgresql://localhost:5432/users}
    username: ${USER_DB_USER:school}
    password: ${USER_DB_PASSWORD:school}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    contexts: ${USER_LIQUIBASE_CONTEXTS:demo}
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

springdoc:
  api-docs:
    path: /v3/api-docs
