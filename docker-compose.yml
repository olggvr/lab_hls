services:
  postgres:
    # Версия базы зафиксирована точным тегом — такая же, как в Testcontainers
    image: postgres:16.4-alpine
    container_name: school-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-school}
      POSTGRES_USER: ${DB_USER:-school}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-school}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: school-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-school}
      DB_USER: ${DB_USER:-school}
      DB_PASSWORD: ${DB_PASSWORD:-school}
      # Liquibase накатывает миграции из src/main/resources/db/changelog при старте приложения.
      # demo — вместе с демо-данными; prod — только схема.
      LIQUIBASE_CONTEXTS: ${LIQUIBASE_CONTEXTS:-demo}
      APP_PORT: 8080
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  pgdata:
